name: 🚀 Media Flow Engine - Publicación Inteligente

on:
  # Ejecutar en horarios específicos (hora UTC)
  # TikTok: 6 veces al día (7:00, 10:00, 13:00, 17:00, 20:00, 22:00 hora España)
  # Instagram: 3 de esas veces (9:00, 14:00, 21:00 hora España)
  schedule:
    - cron: '0 6 * * *'   # 07:00 España - TikTok
    - cron: '0 8 * * *'   # 09:00 España - TikTok + Instagram
    - cron: '0 9 * * *'   # 10:00 España - TikTok
    - cron: '0 12 * * *'  # 13:00 España - TikTok
    - cron: '0 13 * * *'  # 14:00 España - TikTok + Instagram
    - cron: '0 16 * * *'  # 17:00 España - TikTok
    - cron: '0 19 * * *'  # 20:00 España - TikTok
    - cron: '0 20 * * *'  # 21:00 España - TikTok + Instagram
    - cron: '0 21 * * *'  # 22:00 España - TikTok
  
  # Permitir ejecución manual
  workflow_dispatch:
    inputs:
      videos_count:
        description: 'Número de videos a procesar'
        required: false
        default: '1'

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    defaults:
      run:
        working-directory: social-automation
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: social-automation/requirements.txt

      - name: 💾 Cache modelos EasyOCR
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-v1

      - name: 📦 Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Instalar navegadores Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 🔧 Preparar directorios
        run: |
          mkdir -p auth data logs videos_raw videos_ready

      - name: 🔄 Convertir cookies a formato Netscape
        run: |
          python utils.py convert

      - name: 🚀 Ejecutar automatización
        env:
          TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
        run: |
          VIDEOS=${{ github.event.inputs.videos_count || '1' }}
          echo "🎬 Procesando $VIDEOS video(s)..."
          echo "🕐 Hora UTC: $(date -u '+%H:%M')"
          python main.py $VIDEOS

      - name: 📊 Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            social-automation/logs/
            social-automation/data/uploaded_videos.json
          retention-days: 7

      - name: 📸 Guardar capturas de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots-${{ github.run_number }}
          path: social-automation/logs/*.png
          retention-days: 7

      - name: 💾 Commit cambios
        if: success()
        run: |
          cd ..
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add social-automation/data/uploaded_videos.json social-automation/data/source_accounts.json || true
          git diff --staged --quiet || git commit -m "🤖 Video publicado - $(date '+%Y-%m-%d %H:%M')"
          git push || true
